<title>Foco</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap">
<style id="pn-css">
:root{
  --bg:#EDEFF4; --surface:#FFFFFF; --surface-2:#F5F6FA; --ink:#141B2D; --muted:#5A6479; --line:#D9DEE8;
  --accent:#2446D6; --accent-ink:#FFFFFF; --accent-soft:#E2E8FF;
  --mark:#FFE14D; --mark-ink:#2E2800;
  --paper:#FFFFFF; --rule:#DCE4F2;
  --ok:#137F55; --ok-soft:#DCF2E8; --warn:#9A6212; --warn-soft:#FBEED6; --bad:#BD3535; --bad-soft:#FBE2E2;
  --rev:#6B42C8; --rev-soft:#ECE5FB;
  --dly:#B8520A;
  --gold-a:#FCE38A; --gold-b:#E9A23B; --gold-ink:#3B2500; --gold-line:#C98A1E;
  --scrim:rgba(12,17,30,.48);
  --shadow:0 1px 2px rgba(20,27,45,.06),0 8px 24px rgba(20,27,45,.07);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1220; --surface:#151C2D; --surface-2:#1B2338; --ink:#E6EAF3; --muted:#9AA4BA; --line:#29324C;
    --accent:#8FA6FF; --accent-ink:#0D1220; --accent-soft:#222C4F;
    --mark:#E2C84A; --mark-ink:#1C1800;
    --paper:#171F31; --rule:#26304A;
    --ok:#4DC894; --ok-soft:#15352A; --warn:#E3B05A; --warn-soft:#382D15; --bad:#F27D7D; --bad-soft:#3D1E24;
    --rev:#B79CFF; --rev-soft:#2A2247;
    --dly:#FB9A4B;
    --gold-a:#F2C94C; --gold-b:#D08A2A; --gold-ink:#231400; --gold-line:#F2C94C;
    --scrim:rgba(0,0,0,.6);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1220; --surface:#151C2D; --surface-2:#1B2338; --ink:#E6EAF3; --muted:#9AA4BA; --line:#29324C;
  --accent:#8FA6FF; --accent-ink:#0D1220; --accent-soft:#222C4F;
  --mark:#E2C84A; --mark-ink:#1C1800;
  --paper:#171F31; --rule:#26304A;
  --ok:#4DC894; --ok-soft:#15352A; --warn:#E3B05A; --warn-soft:#382D15; --bad:#F27D7D; --bad-soft:#3D1E24;
  --rev:#B79CFF; --rev-soft:#2A2247;
  --dly:#FB9A4B;
  --gold-a:#F2C94C; --gold-b:#D08A2A; --gold-ink:#231400; --gold-line:#F2C94C;
  --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;text-wrap:balance;line-height:1.15}
p{margin:0}
.num{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.disp{font-stretch:125%;font-weight:800;letter-spacing:-.015em}
.muted{color:var(--muted)}
.label{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:14px 72px;display:flex;flex-direction:column;gap:26px}
@media (min-width:720px){.wrap{padding-inline:28px}}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand b{font-stretch:125%;font-weight:800;font-size:14px;letter-spacing:.02em;text-transform:uppercase}
.brand span{font-size:13px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.ok{color:var(--ok);background:var(--ok-soft);border-color:transparent}
.chip.warn{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.chip.bad{color:var(--bad);background:var(--bad-soft);border-color:transparent}
.chip.info{color:var(--accent);background:var(--accent-soft);border-color:transparent}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:12px;font-weight:600;font-size:14px;cursor:pointer;line-height:1.2;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.08)}
.btn.good{background:var(--ok);color:var(--surface);border-color:transparent}
.btn.good:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.solid{background:var(--bad);color:var(--surface)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);padding-inline:8px}
.btn.ghost:hover{color:var(--ink)}
.btn.lg{padding:13px 18px;font-size:15px;border-radius:14px}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* example banner */
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--mark);color:var(--mark-ink);border-radius:16px;padding:12px 16px;font-size:14px}
.banner .btn{background:rgba(255,255,255,.85);color:#2E2800;border-color:transparent}

/* stat strip */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:720px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat .v{font-size:28px;font-weight:700;line-height:1.1}
.stat .v small{font-size:13px;font-weight:500;color:var(--muted);margin-left:4px;font-family:"Archivo",system-ui,sans-serif}
.stat .s{font-size:13px;color:var(--muted)}
.stat.today-yes{background:var(--ok-soft);border-color:transparent}
.stat.today-yes .v,.stat.today-yes .s{color:var(--ok)}
.stat.today-no{background:var(--warn-soft);border-color:transparent}
.stat.today-no .v,.stat.today-no .s{color:var(--warn)}

/* calendar */
.cal{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:12px}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.cal-head h2{font-size:22px;text-transform:capitalize}
.cal-nav{display:flex;gap:6px}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
.icon-btn:hover{border-color:var(--muted)}
.dows,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.dows span{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center}
.day{position:relative;min-height:64px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);padding:6px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;cursor:pointer;text-align:left;min-width:0}
.day .dn{font-size:13px;font-weight:600}
.day.out{opacity:.4}
.day.lv1{background:color-mix(in srgb,var(--mark) 22%,var(--surface))}
.day.lv2{background:color-mix(in srgb,var(--mark) 42%,var(--surface))}
.day.lv3{background:color-mix(in srgb,var(--mark) 66%,var(--surface))}
.day.lv4{background:var(--mark)}
.day.lv3 .dn,.day.lv4 .dn,.day.lv3 .m,.day.lv4 .m{color:var(--mark-ink)}
.day.today{border:2px solid var(--accent)}
.day.sel{box-shadow:0 0 0 3px var(--accent-soft);border-color:var(--accent)}
.marks{display:flex;gap:3px;flex-wrap:wrap}
.m{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;font-family:"IBM Plex Mono",ui-monospace,monospace;line-height:1}
.m::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--dot)}
.m.w{--dot:var(--accent)} .m.c{--dot:var(--ok)} .m.r{--dot:var(--rev)} .m.y{--dot:var(--dly)}
@media (max-width:560px){
  .day{min-height:50px;padding:5px;border-radius:10px}
  .m{font-size:0;gap:0}
  .m::before{width:6px;height:6px}
}
.day.tl-ok{background:var(--ok-soft);border-color:transparent}
.day.tl-part{background:var(--warn-soft)}
.day.tl-miss{background:var(--bad-soft)}
.day .frac{font-style:normal;font-size:12px;font-weight:700;line-height:1}
.day.tl-ok .frac{color:var(--ok)} .day.tl-part .frac{color:var(--warn)} .day.tl-miss .frac{color:var(--bad)}
.lgkey{padding:1px 8px;border-radius:6px;font-weight:600}
.lgkey.tl-ok{background:var(--ok-soft);color:var(--ok)} .lgkey.tl-part{background:var(--warn-soft);color:var(--warn)} .lgkey.tl-miss{background:var(--bad-soft);color:var(--bad)}
.needbox h4{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px;display:flex;gap:8px;align-items:center}
.needbox ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.needbox li{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:6px 10px;border-radius:10px;background:var(--surface-2)}
.needbox li b{font-weight:600;white-space:nowrap}
.needbox li.nd-ok b,.needbox li.nd-comp b{color:var(--ok)} .needbox li.nd-miss b{color:var(--bad)} .needbox li.nd-todo b{color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend .m{font-family:inherit;font-weight:500;font-size:12.5px;gap:6px;color:var(--muted)}
.daypanel{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:12px}
.daypanel h3{font-size:16px;font-weight:700}
.daypanel h3::first-letter{text-transform:uppercase}
.dgroups{display:grid;gap:12px}
@media (min-width:720px){.dgroups{grid-template-columns:repeat(4,minmax(0,1fr))}}
.dgroup h4{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;display:flex;align-items:center;gap:6px;margin-bottom:6px}
.dgroup h4::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--dot)}
.dgroup.w{--dot:var(--accent)} .dgroup.c{--dot:var(--ok)} .dgroup.r{--dot:var(--rev)} .dgroup.y{--dot:var(--dly)}
.dgroup ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.dgroup li{font-size:14px;line-height:1.35}
.dgroup li small{display:block;color:var(--muted);font-size:12.5px}

/* persona */
.persona{display:flex;flex-direction:column;gap:14px}
.persona-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.persona h1{font-size:clamp(34px,7vw,58px);line-height:1}
.hl{background:linear-gradient(transparent 58%,var(--mark) 58%,var(--mark) 90%,transparent 90%);padding-inline:2px}
.ruled{background-color:var(--paper);background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(2rem - 1px),var(--rule) calc(2rem - 1px),var(--rule) 2rem);background-position:0 1rem;border:1px solid var(--line);border-radius:22px;padding:1rem 1.25rem;font-family:"Literata",Georgia,"Times New Roman",serif;font-size:1.15rem;line-height:2rem;min-height:12rem;white-space:pre-wrap;box-shadow:var(--shadow)}
@media (min-width:720px){.ruled{font-size:1.28rem;padding:1rem 2rem;min-height:14rem}}
.ruled.empty{color:var(--muted);font-style:italic}
textarea.ruled{width:100%;resize:vertical;display:block;color:var(--ink)}

/* sections */
.sec{display:flex;flex-direction:column;gap:12px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sec-head h2{font-size:24px}
.sec-head .aside{font-size:13px;color:var(--muted)}

/* reviews */
.rev{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:14px}
.rev-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.rev-item{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 12px;border-radius:14px;background:var(--surface-2)}
.rev-item.late{background:var(--bad-soft)}
.rev-main{flex:1 1 220px;min-width:0}
.rev-main b{display:block;font-weight:600;overflow-wrap:anywhere}
.rev-main small{color:var(--muted);font-size:13px}
.stage{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;font-weight:500;padding:3px 8px;border-radius:8px;background:var(--rev-soft);color:var(--rev);white-space:nowrap}
.due{font-size:13px;font-weight:600;white-space:nowrap}
.due.late{color:var(--bad)} .due.now{color:var(--ok)} .due.soon{color:var(--muted)}
.rev-empty{padding:14px;border-radius:14px;background:var(--surface-2);color:var(--muted);font-size:14px}
details.fold{border-top:1px solid var(--line);padding-top:10px}
details.fold summary{cursor:pointer;font-weight:600;font-size:14px;list-style:none;display:flex;align-items:center;gap:8px}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary::before{content:"▸";color:var(--muted);transition:transform .15s}
details.fold[open] summary::before{transform:rotate(90deg)}
details.fold > .rev-list{margin-top:10px}

/* doors (big rectangles) */
.doors{display:grid;gap:14px}
@media (min-width:720px){.doors{grid-template-columns:1fr 1fr}}
.door{display:flex;flex-direction:column;gap:14px;text-align:left;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:30px;padding:22px;box-shadow:var(--shadow);transition:transform .15s,border-color .15s;color:var(--ink)}
.door:hover{transform:translateY(-2px);border-color:var(--accent)}
.door-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.door h2{font-size:clamp(26px,5vw,34px)}
.door .arrow{width:42px;height:42px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;flex:none}
.door-nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.door-nums div{display:flex;flex-direction:column;gap:2px}
.door-nums b{font-size:22px;font-weight:700}
.door-nums span{font-size:12px;color:var(--muted)}

.bar-track{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.bar-fill{height:100%;background:var(--accent);border-radius:999px}
.bar-fill.ok{background:var(--ok)}

/* list + item pages */
.back{align-self:flex-start}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.page-head h1{font-size:clamp(30px,6vw,46px)}
.cards{display:grid;gap:14px}
@media (min-width:720px){.cards{grid-template-columns:1fr 1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:14px;text-align:left;cursor:pointer;color:var(--ink);transition:border-color .15s}
.card:hover{border-color:var(--accent)}
.card h3{font-size:20px;font-weight:700;overflow-wrap:anywhere}
.dl{font-size:13px;font-weight:600;padding:3px 9px;border-radius:8px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.dl.late{background:var(--bad-soft);color:var(--bad)}
.dl.soon{background:var(--warn-soft);color:var(--warn)}
.periods{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.period{background:var(--surface-2);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:3px;min-width:0}
.period b{font-size:18px;font-weight:600}
.period b em{font-style:normal;color:var(--muted);font-weight:400}
.period small{font-size:12px;color:var(--muted)}
.late-note{font-size:13px;color:var(--bad);font-weight:600}
.empty-state{background:var(--surface);border:1px dashed var(--line);border-radius:24px;padding:28px 20px;display:flex;flex-direction:column;gap:12px;align-items:flex-start;color:var(--muted)}

.parts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.sq{min-height:150px;border-radius:20px;border:1px solid var(--line);background:var(--surface);padding:12px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;text-align:left;cursor:pointer;color:var(--ink);transition:transform .12s,border-color .12s;min-width:0}
.sq:hover{transform:translateY(-2px);border-color:var(--accent)}
.sq-state{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.sq-name{font-weight:600;font-size:15px;line-height:1.3;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.sq-foot{display:flex;justify-content:space-between;gap:6px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.sq.done{background:var(--ok-soft);border-color:transparent}
.sq.done .sq-state{color:var(--ok)}
.sq.late{border-color:var(--bad)}
.sq.late .sq-state{color:var(--bad)}
.sq.soon .sq-state{color:var(--warn)}

/* modal */
.overlay{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
@media (min-width:640px){.overlay{align-items:center}}
.sheet{background:var(--surface);color:var(--ink);border-radius:24px;width:100%;max-width:540px;max-height:calc(100% - 24px);overflow:auto;padding:20px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow)}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sheet h2{font-size:22px;overflow-wrap:anywhere}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.facts div{background:var(--surface-2);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.facts b{font-size:15px;font-weight:600}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;max-height:220px;overflow:auto}
.hist li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 10px;border-radius:10px;background:var(--surface-2);font-size:14px}
.revbox{background:var(--rev-soft);color:var(--rev);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600}
.field input[type=text],.field input[type=date],.field input[type=number],.field select,.field textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:10px 12px;width:100%}
.field textarea{min-height:150px;resize:vertical;line-height:1.5}
.field .hint{font-size:12.5px;color:var(--muted)}
.radios{display:flex;flex-direction:column;gap:8px}
.radios label{display:flex;gap:8px;align-items:flex-start;font-weight:500;font-size:14px}
.confirm{background:var(--bad-soft);color:var(--bad);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;font-size:14px;font-weight:600}

/* import */
.sheet.wide{max-width:680px}
.drop{border:2px dashed var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;cursor:pointer;background:var(--surface-2)}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop b{color:var(--accent)}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.field textarea.mono,.model{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.6}

var mode='pending';// pending | edit | view | local

function scheduleSave(){

function busy(){var a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return true;if(ui.modal&&ui.modal.kind!=='part')return true;if(ui.modal&&(ui.modal.edit||ui.modal.cardEdit))return true;if(ui.editPersona)return true;return false;}

function flush(force){
  clearTimeout(saveTimer);
  if(!dirty||saving||mode!=='edit'||!art||vault.locked||viewing)return;
  if(!force&&busy()){saveTimer=setTimeout(flush,1500);return;}
  saving=true;paintChip();stashUi();
  sealVault().then(function(vs){vault.str=vs;return art.publish(buildDoc());}).then(function(){dirty=false;saving=false;paintChip();}).catch(function(e){
    saving=false;var c=e&&e.code;
    if(c==='conflict'){dirty=false;toast('Havia uma versão mais nova salva em outro aparelho. Carregando ela agora.');}
    else if(['not_writer','not_granted','consent_required','not_declared','capability_disabled','capability_removed'].indexOf(c)>=0){mode='view';dirty=false;render();toast('Esta tela é só de visualização: as alterações não foram salvas.');}
    else if(c==='rate_limited'){saveTimer=setTimeout(flush,20000);}
    else if(c==='too_large'){saveErr=true;toast('Os dados ficaram grandes demais para salvar.');}
    else if(!retried){retried=true;saveTimer=setTimeout(flush,2500+Math.random()*2000);}
    else{saveErr=true;toast('Não deu para salvar agora. Faça outra alteração para tentar de novo.');retried=false;}
    paintChip();

}

/* Tudo o que está na página aparece no código para quem abre o link. Por isso o que fica oculto
   sai do pn-data e vai para o pn-vault, cifrado com AES-GCM; a chave vem da senha (PBKDF2). */
var SUB=(window.crypto&&window.crypto.subtle&&window.TextEncoder)?window.crypto.subtle:null;

    return SUB.deriveKey({name:'PBKDF2',salt:salt,iterations:iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);

}
function hideIds(){var h={};['cap','proj','daily'].forEach(function(k){state[k].forEach(function(x){if(x.hide)h[x.id]=1;});});return h;}

function splitState(){
  var h=hideIds(),sh=state.sh||{},hidePers=sh.persona!==false,hideBase=sh.base!==false;
  var pub=Object.assign({},state),priv={cap:[],proj:[],daily:[],ach:[],log:[],reviews:[],ib:{},labels:state.labels.slice(),persona:hidePers?state.persona:null,base:hideBase?state.base:null,why:state.why||{}};
  pub.why={};
  pub.persona=hidePers?'':state.persona;pub.base=hideBase?'':state.base;
  ['cap','proj'].forEach(function(k){
    pub[k]=[];
    state[k].forEach(function(it){
      if(it.hide){priv[k].push(it);return;}
      if(hideBase&&it.base){priv.ib[it.id]=it.base;var c=Object.assign({},it);delete c.base;pub[k].push(c);}else pub[k].push(it);
    });
  });
  pub.daily=[];state.daily.forEach(function(d){(d.hide?priv.daily:pub.daily).push(d);});
  pub.ach=[];state.ach.forEach(function(a){(achHidden(a,h)?priv.ach:pub.ach).push(a);});
  pub.log=[];state.log.forEach(function(e){(h[e.item]?priv.log:pub.log).push(e);});
  pub.reviews=[];state.reviews.forEach(function(r){(h[r.item]?priv.reviews:pub.reviews).push(r);});

function mergePriv(p){
  if(p.persona!=null)state.persona=p.persona;
  if(p.base!=null)state.base=p.base;
  if(p.why&&typeof p.why==='object')state.why=p.why;
  ['cap','proj'].forEach(function(k){
    state[k].forEach(function(it){if(p.ib&&p.ib[it.id])it.base=p.ib[it.id];});
    state[k]=state[k].concat(p[k]||[]);
  });

  state.log=state.log.concat(p.log||[]);state.reviews=state.reviews.concat(p.reviews||[]);
  if(p.labels)state.labels=p.labels;

  var ord=state.ord||{};
  ['cap','proj','daily','ach'].forEach(function(k){
    var ix={};(ord[k]||[]).forEach(function(id,i){ix[id]=i;});
    state[k].sort(function(a,b){return (ix[a.id]==null?1e9:ix[a.id])-(ix[b.id]==null?1e9:ix[b.id]);});

function sealVault(){

}
function createVault(pass,remember){

    vault.on=true;vault.locked=false;vault.pass=pass;vault.salt=salt;vault.iter=iter;vault.key=key;vault.err=null;

/* ---------- necessárias, compensação e contagem do dia ---------- */
function isNeeded(d){return norm(d.label||'')===norm(NEED);}
function dailyCounts(id){var c={};state.log.forEach(function(e){if(e.t==='daily'&&e.item===id)c[e.d]=(c[e.d]||0)+1;});return c;}
function appStart(){var m=today();state.log.forEach(function(e){if(e.d<m)m=e.d;});state.daily.forEach(function(d){if(d.created&&d.created<m)m=d.created;});return m;}
/* cada dia sem registro vira uma falta; um dia com 2 ou mais registros compensa as faltas mais antigas */
function needLedger(d){
  var c=dailyCounts(d.id),t=today(),from=d.created||appStart(),k;
  for(k in c){if(k<from)from=k;}
  if(from>t)from=t;
  var cov={},q=[],cnt={},x=from;
  for(;x<=t;x=addDays(x,1)){
    var n=c[x]||0;cnt[x]=n;
    if(n>1){var sr=n-1;while(sr>0&&q.length){cov[q.shift()]=x;sr--;}}
    if(n===0&&x<t)q.push(x);
  }
  return {from:from,cnt:cnt,cov:cov,debts:q};
}
function candCount(we){var n=0;['cap','proj'].forEach(function(k){state[k].forEach(function(it){if(it.status==='espera'||it.daily||!it.parts.length)return;if(it.spw===1&&!we)return;n++;});});return n;}
function tallyCtx(){
  var led={},byDay={};
  state.daily.forEach(function(d){if(isNeeded(d))led[d.id]=needLedger(d);});
  state.log.forEach(function(e){(byDay[e.d]=byDay[e.d]||[]).push(e);});
  return {led:led,byDay:byDay,cand:{wk:candCount(false),we:candCount(true)},start:appStart()};
}
function dayTally(day,ctx){
  var t=today(),rows=[],req=0,done=0;
  state.daily.forEach(function(d){
    var L=ctx.led[d.id];if(!L||day<L.from)return;
    var n=L.cnt[day]||0,st=n>0?'ok':L.cov[day]?'comp':day<t?'miss':'todo';
    rows.push({kind:'need',name:d.name,n:n,st:st,by:L.cov[day]||null});req++;if(st==='ok'||st==='comp')done++;
  });
  ['cap','proj'].forEach(function(k){state[k].forEach(function(it){
    if(!it.daily||it.status==='espera'||!it.parts.length)return;
    if(day<(it.since||ctx.start))return;
    var did=(ctx.byDay[day]||[]).some(function(e){return e.item===it.id&&(e.t==='work'||e.t==='done');});
    if(!did&&!it.parts.some(function(q){return (!q.start||q.start<=day)&&(!q.done||q.done>=day);}))return;
    rows.push({kind:'cap',name:it.name,n:did?1:0,st:did?'ok':day<t?'miss':'todo'});req++;if(did)done++;
  });});
  var we=parse(day).getDay()%6===0,rq=Math.min(we?gcfg().we:gcfg().wk,we?ctx.cand.we:ctx.cand.wk);
  if(rq>0){
    var seen={};(ctx.byDay[day]||[]).forEach(function(e){if(e.part&&(e.t==='work'||e.t==='done')){var f=findItem(e.k,e.item);if(f&&!f.daily)seen[e.part]=1;}});
    var dn=Math.min(Object.keys(seen).length,rq);
    rows.push({kind:'study',name:'Sessões de estudo',n:dn,req:rq,st:dn>=rq?'ok':day<t?'miss':'todo'});req+=rq;done+=dn;
  }
  return {rows:rows,req:req,done:done};
}

  var weeks=Math.ceil((off+dim)/7),start=addDays(iso(first),-off),idx=dayIndex(),t=today(),cells='',ctx=tallyCtx();
  for(var i=0;i<weeks*7;i++){
    var d=addDays(start,i),dd=parse(d),o=idx[d],tot=o?o.list.length:0,tl=(d>=ctx.start&&d<=t)?dayTally(d,ctx):null;

    var al=fmtLong(d)+(tl&&tl.req?': '+tl.done+' de '+tl.req+' necessárias':o?': '+o.w+' trabalho, '+o.c+' concluídas, '+o.r+' revisões, '+o.y+' diárias':': sem registros');
    cells+='<button class="'+cls+'" data-act="cal-day" data-d="'+d+'" aria-label="'+esc(al)+'"'+(d===ui.sel?' aria-pressed="true"':'')+'><span class="dn num">'+dd.getDate()+'</span><span class="marks">'+marks+'</span></button>';

   dayPanel(idx,ctx)+'</section>';

function reviews(){
  var t=today(),rs=state.reviews.slice();
  var rpn=reviewPlan(t),now=rpn.show,wait=rpn.wait;
  var next=rs.filter(function(r){return r.due&&r.due>t;}).sort(function(a,b){return a.due<b.due?-1:1;});
  var fut=rs.filter(function(r){return !r.due;});
  function row(r,actions){
    var f=findPart(r.part);if(!f)return '';
    var dt,cls;if(!r.due){dt='sem data';cls='soon';}else if(actions===actWait){dt='na fila';cls='soon';}else{var n=diff(t,r.due);if(n<0){dt='atrasada '+(-n)+' '+plural(-n,'dia','dias');cls='late';}else if(n===0){dt='hoje';cls='now';}else{dt=(n===1?'amanhã':'em '+n+' dias')+' · '+fmt(r.due);cls='soon';}}

   '<details class="fold"'+(next.length&&ui.revAll?' open':'')+'><summary>Próximas <span class="num muted">'+next.length+'</span></summary>'+
     (next.length?'<ul class="rev-list">'+shown.map(function(r){return row(r,null);}).join('')+'</ul>'+(next.length>4?'<button class="btn ghost sm" data-act="rev-all" style="margin-top:6px">'+(ui.revAll?'Mostrar menos':'Ver todas as '+next.length)+'</button>':''):'<p class="muted" style="margin-top:8px;font-size:14px">Nada agendado.</p>')+'</details>'+

  var it=(e.k==='cap'||e.k==='proj')?findItem(e.k,e.item):null;return it?areaOf(it):'prof';

/* ---------- tarefas diárias ---------- */
var WD=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
function weekPlan(d){var w=d&&d.week;return Array.isArray(w)&&w.some(function(x){return String(x||'').trim();})?w:null;}
function planOn(d,day){var w=weekPlan(d);return w?String(w[parse(day).getDay()]||'').trim():'';}
function weekSection(d){

  }).join('')+'</div><div class="row"><button class="btn primary sm" data-act="week-save" data-id="'+d.id+'">Salvar plano da semana</button></div></div>';
  if(!w)return '';

    return '<div class="wkday'+(i===t?' today':'')+'"><b class="wkname">'+WD[i]+(i===t?' · hoje':'')+'</b><div class="wkbody">'+(tx?esc(tx):'<span class="muted">Sem plano</span>')+'</div></div>';
  }).join('')+'</div></div>';

/* ---------- guia do dia ---------- */
var SLOTS=[['wake','Ao acordar','07:00'],['day','Durante o dia',''],['am','Trajeto de ida','07:45'],['lunch','Almoço','12:30'],['pm','Trajeto de volta','18:15'],['pre','Antes de estudar','19:10'],['study','Estudo','20:15'],['bed','Antes de dormir','22:00']];
function slotOf(d){
  if(d.slot&&SLOTS.some(function(s){return s[0]===d.slot;}))return d.slot;
  var n=norm(d.name);
  if(/acordar|cama|dente|orar|oracao/.test(n))return 'wake';
  if(/listening|speaking|almoc/.test(n))return 'lunch';
  if(/exerc|treino|scapular|calistenia|caminhada/.test(n))return 'pre';
  if(/dormir|sono/.test(n))return 'bed';
  return 'day';
}
function gcfg(){var g=state.guide||{};return {t:g.t||{},wk:g.wk>0?g.wk:2,we:g.we>0?g.we:4,rv:g.rv>0?g.rv:2,rw:g.rw>0?g.rw:6};}
/* revisões de hoje: limite por dia (úteis/fim de semana); as novas (D+1) vêm primeiro e o resto espera na fila */
function reviewPlan(t){
  t=t||today();var c=gcfg(),we=parse(t).getDay()%6===0,lim=we?c.rw:c.rv;
  var done=state.log.filter(function(e){return e.t==='review'&&e.d===t;}).length;
  var q=state.reviews.filter(function(r){return r.due&&r.due<=t&&findPart(r.part);}).sort(function(a,b){var na=a.stage===0?0:1,nb=b.stage===0?0:1;return na!==nb?na-nb:(a.due<b.due?-1:a.due>b.due?1:0);});
  var room=Math.max(0,lim-done);
  return {lim:lim,done:done,show:q.slice(0,room),wait:q.slice(room)};
}
function slotTime(s){var c=gcfg();return (c.t&&c.t[s[0]])||s[2];}
function srcLine(p){var l=String(p&&p.note||'').split('\n').map(function(x){return x.trim();}).filter(function(x){return /^(source|fonte)\s*:/i.test(x);})[0];return l?l.replace(/^(source|fonte)\s*:\s*/i,'').slice(0,110):'';}
function workedOn(p,t){return workOf(p.id).some(function(e){return e.d===t;})||p.done===t;}
function focusPart(it,t){
  var w=it.parts.find(function(p){return workedOn(p,t);});
  if(w)return w;
  return it.parts.filter(function(p){return !p.done&&(!p.start||p.start<=t);}).sort(function(a,b){return (a.due||'9999')<(b.due||'9999')?-1:1;})[0]||null;
}
function pickParts(n,t,we){
  var rk={profundo:0,solido:1,conceitual:2},c=[];
  /* itens de 1 sessão por semana só entram no fim de semana, antes dos demais e na ordem da lista (projetos antes de capacidades) */
  ['cap','proj'].forEach(function(k){state[k].forEach(function(it,i){
    if(it.status==='espera'||it.daily||(it.spw===1&&!we))return;
    var p=focusPart(it,t);if(!p)return;
    c.push({k:k,it:it,p:p,today:workedOn(p,t),wk:!!(we&&it.spw===1),ix:(k==='proj'?0:1000)+i,late:(p.due||'9999')<=t,rank:rk[it.depth]!=null?rk[it.depth]:1});
  });});
  c.sort(function(a,b){
    if(a.today!==b.today)return a.today?-1:1;
    if(a.wk!==b.wk)return a.wk?-1:1;
    if(a.wk&&a.ix!==b.ix)return a.ix-b.ix;
    if(a.late!==b.late)return a.late?-1:1;
    if(a.late&&a.p.due!==b.p.due)return a.p.due<b.p.due?-1:1;
    if(a.rank!==b.rank)return a.rank-b.rank;
    return (a.p.due||'9999')<(b.p.due||'9999')?-1:1;
  });
  return c.slice(0,n);
}
function guide(){
  var t=today(),dow=parse(t).getDay(),we=dow===0||dow===6,by={};
  function put(s,x){(by[s]=by[s]||[]).push(x);}
  var late=[];
  state.daily.forEach(function(d){
    var sl=slotOf(d),x={type:'daily',d:d,done:!!dailyDates(d.id)[t]},cx=[];
    if(isNeeded(d))needLedger(d).debts.forEach(function(day){var pl=d.comp&&d.comp[day];if(pl&&pl>t)return;cx.push({type:'comp',d:d,day:day,plan:pl||'',done:false});});
    if(sl==='study'){late.push(x);cx.forEach(function(c){late.push(c);});}else{put(sl,x);cx.forEach(function(c){put(sl,c);});}
  });
  ['cap','proj'].forEach(function(k){state[k].forEach(function(it){
    if(!it.daily||it.status==='espera')return;
    var sl=SLOTS.some(function(z){return z[0]===it.slot;})?it.slot:'study',dp=focusPart(it,t),x;
    if(!dp)return;
    x={type:'study',k:k,it:it,p:dp,done:workedOn(dp,t)};

  var st=picks.map(function(c){return {type:'study',k:c.k,it:c.it,p:c.p,done:workedOn(c.p,t)};});
  var todo=[];
  if(we)by.study=(by.study||[]).concat(st,todo,late);else{st.concat(todo,late).forEach(function(x){put('study',x);});}

}

  if(r.type==='sequencia'||r.type==='diaria'){
    var set={},nm='';
    if(r.type==='diaria'){var dd=dailyById(r.daily);if(!dd)return res('prog',0,'Escolha uma tarefa diária');set=dailyDates(dd.id);nm=' em “'+dd.name+'”';}
    else entriesFor(r.area,'all').forEach(function(e){set[e.d]=1;});
    var best=bestStreak(set,r.ini,r.fim),cur=streakOf(set);
    if(best>=N)return res('won',1,'Sequência de '+best+' '+plural(best,'dia','dias')+nm);
    if(dl||(r.fim&&r.fim<t))return res('lost',best/N,'Melhor sequência: '+best+' de '+N+' dias');
    return res('prog',best/N,'Melhor sequência: '+best+' de '+N+' dias · atual: '+cur);
  }
  if(r.type==='total'){
    var n=entriesFor(r.area,r.what).filter(function(e){return (!r.ini||e.d>=r.ini)&&(!r.fim||e.d<=r.fim);}).length;
    if(n>=N)return res('won',1,n+' '+whatLabel(r.what));
    if(dl||(r.fim&&r.fim<t))return res('lost',n/N,n+' de '+N+' '+whatLabel(r.what));
    return res('prog',n/N,n+' de '+N+' '+whatLabel(r.what));
  }
  if(!r.ini||!r.fim||r.fim<r.ini)return res('prog',0,'Defina o período (início e fim)');
  var days=diff(r.ini,r.fim)+1,started=t>=r.ini,over=t>r.fim;
  if(!started&&r.type!=='partes')return res('prog',0,'Começa em '+fmtY(r.ini)+' · '+days+' dias');
  if(r.type==='dias'){
    var hs={};entriesFor(r.area,'all').forEach(function(e){if(e.d>=r.ini&&e.d<=r.fim)hs[e.d]=1;});
    var hit=Object.keys(hs).length,need=Math.ceil(N/100*days),allowed=days-need;
    var pastDays=over?days:Math.max(0,diff(r.ini,t)),hitPast=Object.keys(hs).filter(function(x){return x<t;}).length,missed=pastDays-hitPast;
    if(hit>=need)return res('won',1,'Registro em '+hit+' de '+days+' dias');
    if(missed>allowed||over)return res('lost',hit/need,hit+' de '+days+' dias com registro · '+missed+' '+plural(missed,'dia','dias')+' sem registro');
    var left=allowed-missed;
    return res('prog',hit/need,hit+' de '+days+' dias com registro (meta: '+need+') · '+(left?'pode falhar mais '+left+' '+plural(left,'dia','dias'):'não pode falhar nenhum dia'));
  }
  if(r.type==='media'){
    var tot=entriesFor(r.area,r.what).filter(function(e){return e.d>=r.ini&&e.d<=r.fim;}).length,goal=N*days,el=diff(r.ini,over?r.fim:t)+1,avg=tot/Math.max(1,el);
    if(tot>=goal)return res('won',1,'Média de '+(tot/days).toFixed(1)+' '+whatLabel(r.what)+' por dia');
    if(over)return res('lost',tot/goal,'Média final: '+(tot/days).toFixed(1)+' por dia (meta: '+N+')');
    return res('prog',tot/goal,'Média até agora: '+avg.toFixed(1)+' por dia · meta: '+N+' · '+tot+' de '+goal);
  }
  if(r.type==='partes'){
    var ps=[];['cap','proj'].forEach(function(k){state[k].forEach(function(it){if(it.status==='espera'||(r.area&&r.area!=='all'&&areaOf(it)!==r.area))return;it.parts.forEach(function(p){if(p.due&&p.due>=r.ini&&p.due<=r.fim)ps.push(p);});});});
    if(!ps.length)return over?res('lost',0,'Nenhuma parte com prazo no período'):res('prog',0,'Nenhuma parte com prazo no período ainda');
    var ok=ps.filter(function(p){return p.done&&p.done<=p.due;}).length,bad=ps.filter(function(p){return (p.done&&p.done>p.due)||(!p.done&&p.due<t);}).length,need2=Math.ceil(N/100*ps.length);
    if(over&&ok>=need2)return res('won',1,ok+' de '+ps.length+' partes entregues no prazo');
    if(over||ps.length-bad<need2)return res('lost',ok/need2,ok+' de '+ps.length+' no prazo · '+bad+' '+plural(bad,'atrasada','atrasadas'));
    return res('prog',ok/need2,ok+' de '+ps.length+' partes no prazo (meta: '+need2+')'+(started?'':' · começa em '+fmtY(r.ini)));
  }
  return res('prog',0,'');
}

function fillDates(parts,end){
  var t=today(),i=0;
  while(i<parts.length){
    if(parts[i].due){i++;continue;}
    var j=i;while(j<parts.length&&!parts[j].due)j++;
    var n=j-i,S=i>0&&parts[i-1].due>t?parts[i-1].due:t,E=j<parts.length?parts[j].due:end,div=j<parts.length?n+1:n;
    if(E){var span=Math.max(diff(S,E),0);for(var q=0;q<n;q++){parts[i+q].due=addDays(S,Math.round((q+1)*span/div));parts[i+q].auto=true;}}
    i=j;
  }

    case 'daily-del-yes':{var di=ui.modal.id;state.daily=state.daily.filter(function(x){return x.id!==di;});state.ach.forEach(function(x){if(x.rule&&x.rule.daily===di)x.rule.daily=null;});ui.modal=null;ui.route='home';commit('Tarefa excluída');break;}
    case 'daily-done':{var dq=dailyById(ui.route.slice(6));if(!dq)break;var td0=today();if(!dailyDates(dq.id)[td0])state.log.push({id:uid(),d:td0,t:'daily',k:'daily',item:dq.id,part:null,iname:dq.name,pname:dq.name,area:areaOf(dq)});commit('Feito hoje. Sequência: '+streakOf(dailyDates(dq.id))+' '+plural(streakOf(dailyDates(dq.id)),'dia','dias'));break;}
    case 'daily-undo':{var du=dailyById(ui.route.slice(6)),tdu=today();if(!du)break;state.log=state.log.filter(function(e){return !(e.t==='daily'&&e.item===du.id&&e.d===tdu);});commit('Registro de hoje desfeito');break;}
    case 'week-save':{var wd=dailyById(d.id);if(wd){var wv=[0,1,2,3,4,5,6].map(function(i){var e=document.getElementById('wk-'+i);return e?e.value.trim():'';});if(wv.some(Boolean))wd.week=wv;else delete wd.week;commit('Plano da semana salvo');}break;}
    case 'daily-text-save':{var dt2=dailyById(ui.route.slice(6)),tx=document.getElementById('daily-text');if(!dt2||!tx)break;dt2.text=tx.value.trim();commit('Texto salvo');break;}
    case 'labels-open':openModal({kind:'labels'});break;
    case 'label-add':{var nl=document.getElementById('new-label'),lv=nl?nl.value.trim().slice(0,40):'';if(!lv)break;if(state.labels.indexOf(lv)<0)state.labels.push(lv);commit('Rótulo adicionado');break;}
    case 'label-del':{var ld=d.l;state.labels=state.labels.filter(function(x){return x!==ld;});state.daily.forEach(function(x){if(x.label===ld)x.label='';});if(ui.dfilter===ld)ui.dfilter='';commit('Rótulo removido');break;}
    case 'ach-new':openModal({kind:'ach',d:{title:'',desc:'',date:'',got:null,type:'manual',area:'all',ini:'',fim:'',meta:'',what:'all',daily:''}});break;
    case 'ach-open':{var ao=state.ach.find(function(x){return x.id===d.id;});if(ao)openModal({kind:'ach',id:ao.id,d:achToDraft(ao)});break;}
    case 'ach-tpl':ui.modal.d=achTpl(d.t);ui.modal.err=null;renderModal();break;
    case 'ach-got':ui.modal.d.got=ui.modal.d.got?null:today();renderModal();break;
    case 'ach-save':{var am=ui.modal,ad=am.d;
      if(!String(ad.title||'').trim()){am.err='Dê um título para a conquista.';renderModal();break;}
      if(PERIOD[ad.type]&&(!ad.ini||!ad.fim||ad.fim<ad.ini)){am.err='Defina o início e o fim do período (o fim não pode ser antes do início).';renderModal();break;}
      if(ad.type==='diaria'&&!ad.daily){am.err='Escolha a tarefa diária.';renderModal();break;}
      var na=draftToAch(ad,am.id);if(am.id){var ix2=state.ach.findIndex(function(x){return x.id===am.id;});if(ix2>=0)state.ach[ix2]=na;else state.ach.push(na);}else state.ach.push(na);
      ui.modal=null;commit(evalAch(na).st==='won'?'Conquista salva, e já conquistada!':'Conquista salva');break;}
    case 'ach-del-yes':{var ai=ui.modal.id;state.ach=state.ach.filter(function(x){return x.id!==ai;});ui.modal=null;commit('Conquista excluída');break;}
    case 'imp-open':openModal({kind:'import',k:d.k,area:d.area||null,into:d.into||null,text:'',step:'input',spread:true,merge:true});break;
    case 'imp-preview':{var mi=ui.modal,ta2=document.getElementById('imp-text');if(ta2&&ta2.value!==mi.text){mi.text=ta2.value;mi.fname=null;}if(!String(mi.text||'').trim()){mi.err='Escolha um arquivo ou cole o texto primeiro.';renderModal();break;}mi.err=null;mi.step='preview';renderModal();break;}
    case 'imp-back':ui.modal.step='input';renderModal();break;
    case 'imp-use':ui.modal.text=MODELO;ui.modal.fname=null;ui.modal.err=null;renderModal();break;
    case 'imp-copy':copyModel();break;
    case 'imp-dl':if(dl)dl.save({filename:'modelo-pessoa-necessaria.txt',data:MODELO}).catch(function(e){var c=e&&e.code;if(c!=='declined')toast('Não deu para baixar aqui. Use “Copiar modelo”.');});break;
    case 'imp-do':doImport();break;
    case 'base-open':openModal({kind:'base'});break;
    case 'base-save':{var bt=document.getElementById('base-text');state.base=(bt?bt.value:(ui.modal.text||'')).trim();ui.modal=null;commit(state.base?'Base de prática salva':'Base de prática removida');break;}
    case 'pr-base':copyText(promptBase(),'Prompt de descrição da base');break;
    case 'due-apply':{var ia=findItem(d.k,d.id),sd=ia&&suggestDue(ia);if(sd){ia.due=sd;commit('Prazo definido: '+fmtY(sd));}break;}
    case 'item-activate':{var iv=findItem(d.k,d.id);if(iv){iv.status='';commit('Começou! Divida em partes e calcule o prazo.');}break;}
    case 'pr-proj':{var ip=findItem(d.k,d.id);if(ip)copyText(promptProject(ip),'Instruções do Projeto');break;}
    case 'pr-parts':{var ix=findItem(d.k,d.id);if(ix)copyText(exportParts(ix),'parts.txt');break;}
    case 'pr-plan':copyText(promptPlan(d.id?findItem(d.k,d.id):null),'Prompt de divisão em partes');break;
    case 'pr-study':{var cs=curPart();if(cs)copyText(promptStudy(cs.item,cs.part),'Prompt da sessão de estudo');break;}
    case 'pr-review-part':{var cr=curPart();if(cr)copyText(promptReview(cr.item,cr.part,reviewOf(cr.part.id)),'Prompt de revisão');break;}
    case 'pr-review':{var rv=state.reviews.find(function(x){return x.id===d.id;}),fr=rv&&findPart(rv.part);if(fr)copyText(promptReview(fr.item,fr.part,rv),'Prompt de revisão');break;}
    case 'prompt-copy':{var pt=ui.modal&&ui.modal.text;if(pt){try{navigator.clipboard.writeText(pt).then(function(){toast('Copiado');},function(){selectPrompt();toast('Use Copiar do seu aparelho: o texto está selecionado.');});}catch(e){selectPrompt();}}break;}
    case 'prompt-back':{var bk=ui.modal.back;ui.modal=bk;renderModal();break;}
    case 'card-edit':ui.modal.cardEdit=true;renderModal();var ct=document.getElementById('card-text');if(ct)ct.focus();break;
    case 'card-cancel':ui.modal.cardEdit=false;renderModal();if(dirty)scheduleSave();break;
    case 'card-save':{var cp=curPart(),cv=document.getElementById('card-text');if(!cp||!cv)break;cp.part.card=cv.value.trim();ui.modal.cardEdit=false;commit(cp.part.card?'Cartão salvo':'Cartão removido');break;}
  }
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&ui.modal){if(ui.modal.edit){ui.modal.edit=false;renderModal();}else closeModal();}});
document.addEventListener('submit',function(ev){
  var f0=ev.target,k0=f0.getAttribute&&f0.getAttribute('data-form');
  if(k0==='guide'){
    ev.preventDefault();var gf=new FormData(f0),gt2={};
    SLOTS.forEach(function(sl){if(sl[2]){var v=String(gf.get('t-'+sl[0])||'');if(/^\d\d:\d\d$/.test(v)&&v!==sl[2])gt2[sl[0]]=v;}});
    state.guide={t:gt2,wk:Math.max(1,Math.round(+gf.get('wk')||2)),we:Math.max(1,Math.round(+gf.get('we')||4)),rv:Math.max(1,Math.round(+gf.get('rv')||2)),rw:Math.max(1,Math.round(+gf.get('rw')||6))};
    ui.modal=null;commit('Guia ajustado');return;
  }
  if(k0==='unlock'){
    ev.preventDefault();var pw=document.getElementById('vault-pass').value,rm=document.getElementById('vault-rem');
    unlock(pw,!!(rm&&rm.checked)).then(function(){render();toast('Conteúdo protegido aberto');}).catch(function(){vault.err='Senha incorreta.';render();var i=document.getElementById('vault-pass');if(i)i.focus();});
    return;
  }
  if(k0==='vcreate'){
    ev.preventDefault();var p1=document.getElementById('vc-1').value,p2=document.getElementById('vc-2').value,rm2=document.getElementById('vc-rem');
    if(p1.length<10){vault.err='Use pelo menos 10 caracteres.';renderModal();return;}
    if(p1!==p2){vault.err='As senhas não são iguais.';renderModal();return;}
    createVault(p1,!!(rm2&&rm2.checked)).then(function(){commit('Senha criada. Texto da home e base de prática agora ficam protegidos.');}).catch(function(){vault.err='Não deu para criar a senha neste navegador.';renderModal();});
    return;
  }
  var f=ev.target,kind=f.getAttribute('data-form');if(!kind)return;ev.preventDefault();
  var fd=new FormData(f),m=ui.modal;if(!m)return;
  if(kind==='item'){
    var name=String(fd.get('name')||'').trim(),due=String(fd.get('due')||'')||null,books=String(fd.get('books')||'').trim();if(!name)return;
    var ibase=String(fd.get('base')||'').trim(),iarea=fd.get('area')==='pess'?'pess':'prof',idepth=DEPTH[fd.get('depth')]?fd.get('depth'):'',ispw=Math.max(0,Math.round(+fd.get('spw')||0))||null,istatus=fd.get('status')==='espera'?'espera':'',ifocus=String(fd.get('focus')||'').trim(),ipractice=String(fd.get('practice')||'').trim(),inotes=fd.get('notes')==='on',idaily=fd.get('daily')==='on',ilang=fd.get('lang')==='on',islot=SLOTS.some(function(z){return z[0]===fd.get('slot');})?fd.get('slot'):'';
    if(m.id){var it=findItem(m.k,m.id);if(it){it.name=name;it.due=due;it.books=books;it.area=iarea;it.depth=idepth;it.spw=ispw;it.status=istatus;if(ifocus)it.focus=ifocus;else delete it.focus;if(ipractice)it.practice=ipractice;else delete it.practice;if(inotes)it.notes=true;else delete it.notes;if(ilang)it.lang=true;else delete it.lang;if(idaily){it.daily=true;if(!it.since)it.since=today();}else{delete it.daily;delete it.since;}if(islot)it.slot=islot;else delete it.slot;if(m.k==='cap')it.base=ibase;}ui.modal=null;commit('Alterações salvas');}
    else{var nw={id:uid(),name:name,due:due,books:books,area:iarea,depth:idepth,spw:ispw,status:istatus,parts:[]};if(ifocus)nw.focus=ifocus;if(ipractice)nw.practice=ipractice;if(inotes)nw.notes=true;if(ilang)nw.lang=true;if(idaily){nw.daily=true;nw.since=today();}if(islot)nw.slot=islot;if(m.k==='cap'&&ibase)nw.base=ibase;state[m.k].push(nw);ui.modal=null;ui.route='item:'+m.k+':'+nw.id;commit((m.k==='cap'?'Capacidade criada':'Projeto criado')+'. Agora divida em partes.');}
  }else if(kind==='part'){
    var it2=findItem(m.k,m.item);if(!it2)return;var pn=String(fd.get('name')||'').trim(),pd=String(fd.get('due')||'')||null,pnote=String(fd.get('note')||'').trim(),preps=Math.max(0,Math.round(+fd.get('reps')||0))||null;if(!pn)return;
    if(m.id){var p=it2.parts.find(function(x){return x.id===m.id;});if(p){p.name=pn;p.due=pd;p.note=pnote;if(preps)p.reps=preps;else delete p.reps;}ui.modal={kind:'part',k:m.k,item:m.item,id:m.id};commit('Parte atualizada');}
    else{var np={id:uid(),name:pn,due:pd,done:null,note:pnote};if(preps)np.reps=preps;it2.parts.push(np);ui.modal=null;commit('Parte adicionada');}
  }else if(kind==='daily'){
    var dn=String(fd.get('name')||'').trim();if(!dn)return;
    var dl2=String(fd.get('newlabel')||'').trim().slice(0,40)||String(fd.get('label')||''),da=fd.get('area')==='pess'?'pess':'prof',dsl=SLOTS.some(function(x){return x[0]===fd.get('slot');})?fd.get('slot'):'';
    if(dl2&&state.labels.indexOf(dl2)<0)state.labels.push(dl2);
    if(m.id){var dx=dailyById(m.id);if(dx){dx.name=dn;dx.label=dl2;dx.area=da;if(dsl)dx.slot=dsl;else delete dx.slot;}ui.modal=null;commit('Tarefa atualizada');}
    else{state.daily.push(dsl?{id:uid(),name:dn,label:dl2,area:da,slot:dsl,text:'',created:today()}:{id:uid(),name:dn,label:dl2,area:da,text:'',created:today()});ui.modal=null;commit('Tarefa diária criada');}
  }else if(kind==='bulk'){
    var it3=findItem(m.k,m.item);if(!it3)return;
    var lines=String(fd.get('lines')||'').split('\n').map(function(s){return s.replace(/^\s*(?:[-•*]|\d+[.)])\s+/,'').trim();}).filter(Boolean);if(!lines.length)return;
    var md=fd.get('mode')||'none',same=String(fd.get('date')||'')||null,t=today(),span=it3.due?Math.max(diff(t,it3.due),0):0;
    lines.forEach(function(nm,i){var due=null;if(md==='spread'&&it3.due)due=addDays(t,Math.max(1,Math.round((i+1)*span/lines.length)));else if(md==='same')due=same;it3.parts.push({id:uid(),name:nm.slice(0,160),due:due,done:null});});
    ui.modal=null;commit(lines.length+' '+plural(lines.length,'parte adicionada','partes adicionadas'));
  }
});

render();
initCaps();
})();
</script>
