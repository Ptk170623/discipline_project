function importPreview(m){
  var r=buildPlan(m),h='',nItems=0,nParts=0;
  r.plan.forEach(function(pi){if(pi.fresh.length||!pi.target)nItems++;nParts+=pi.fresh.length;});
  if(r.errs.length)h+='<div class="warnbox"><b>'+r.errs.length+' '+plural(r.errs.length,'aviso','avisos')+'</b><ul>'+r.errs.slice(0,8).map(function(e){return '<li>'+esc(e)+'</li>';}).join('')+(r.errs.length>8?'<li>e mais '+(r.errs.length-8)+'…</li>':'')+'</ul></div>';
  var back='<button class="btn" data-act="imp-back">Voltar e editar</button>';
  if(!r.plan.length)return h+'<p class="muted">Nada para importar. Confira se o texto segue o modelo.</p><div class="row">'+back+'</div>';
  var opts='';
  if(r.plan.some(function(pi){return pi.undated;}))opts+='<label class="check"><input type="checkbox" id="imp-spread"'+(m.spread!==false?' checked':'')+'> <span>Distribuir datas para as partes sem data, até o prazo final</span></label>';
  if(!m.into&&r.plan.some(function(pi){return pi.exists;}))opts+='<label class="check"><input type="checkbox" id="imp-merge"'+(m.merge!==false?' checked':'')+'> <span>Quando o nome já existir, adicionar as partes novas nele em vez de criar outro</span></label>';
  if(opts)h+='<div style="display:flex;flex-direction:column;gap:8px">'+opts+'</div>';
  h+=r.plan.map(function(pi){
    var st=pi.target?'Adiciona em '+(pi.k==='cap'?'capacidade existente':'projeto existente')+' · '+pi.fresh.length+' '+plural(pi.fresh.length,'parte nova','partes novas')+(pi.dups.length?' · '+pi.dups.length+' já '+plural(pi.dups.length,'existia','existiam'):''):('Novo · '+pi.fresh.length+' '+plural(pi.fresh.length,'parte','partes'));
    var rows=pi.fresh.concat(pi.dups).map(function(p){return '<li'+(p.dup?' class="dup"':'')+'><span>'+esc(p.name)+(p.note&&!p.dup?'<small>'+esc(p.note.replace(/\n+/g,' · ').slice(0,110))+'</small>':'')+'</span><span class="num'+(p.auto?' auto':'')+'">'+(p.dup?'já existe':(p.due?(p.auto?'≈ ':'')+fmtY(p.due):'sem data'))+'</span></li>';}).join('');
    return '<div class="imp-item"><div class="row" style="justify-content:space-between;align-items:flex-start"><span class="row" style="gap:8px;min-width:0"><span class="kchip">'+KIND[pi.k].One+'</span><h3>'+esc(pi.name)+'</h3></span><span class="dl">'+(pi.due?'prazo '+fmtY(pi.due):(pi.target&&pi.target.due?'prazo '+fmtY(pi.target.due):'sem prazo'))+'</span></div>'+
      '<span class="muted" style="font-size:13px">'+st+(pi.books?' · Livros: '+esc(pi.books.replace(/\n/g,'; ')):'')+'</span>'+(rows?'<ul class="imp-parts">'+rows+'</ul>':'')+'</div>';
  }).join('');
  if(r.plan.some(function(pi){return pi.fresh.some(function(p){return p.auto;});}))h+='<p class="muted" style="font-size:13px">≈ data distribuída pelo app</p>';
  var label=nParts?'Importar '+nParts+' '+plural(nParts,'parte','partes'):'Importar';
  return h+'<div class="row"><button class="btn primary" data-act="imp-do"'+(nItems||nParts?'':' disabled')+'>'+label+'</button>'+back+'</div>';
}
function loadImportFile(file){
  var m=ui.modal;if(!m||m.kind!=='import'||!file)return;
  if(file.size>512000){m.err='Arquivo grande demais (máximo 500 KB).';renderModal();return;}
  var rd=new FileReader();
  rd.onload=function(){if(ui.modal!==m)return;m.text=String(rd.result||'');m.fname=file.name.replace(/\.[^.]+$/,'').trim()||null;m.err=null;m.step='preview';renderModal();};
  rd.onerror=function(){m.err='Não deu para ler o arquivo. Tente colar o texto.';renderModal();};
  rd.readAsText(file,'UTF-8');
}
function doImport(){
  var m=ui.modal,r=buildPlan(m),last=null,nP=0,nI=0;
  r.plan.forEach(function(pi){
    var t=pi.target;
    if(!t){if(!pi.fresh.length&&pi.dups.length)return;t={id:uid(),name:pi.name,due:pi.due,books:pi.books,parts:[]};state[pi.k].push(t);nI++;}
    else{if(!t.due&&pi.due)t.due=pi.due;if(!t.books&&pi.books)t.books=pi.books;}
    pi.fresh.forEach(function(p){t.parts.push({id:uid(),name:p.name,due:p.due||null,done:null,note:p.note||''});nP++;});
    last={k:pi.k,id:t.id};
  });
  ui.modal=null;
  if(last)ui.route=r.plan.length===1?'item:'+last.k+':'+last.id:'list:'+last.k;
  window.scrollTo(0,0);
  commit('Importado: '+(nI?nI+' '+plural(nI,'item novo','itens novos')+' · ':'')+nP+' '+plural(nP,'parte','partes'));
}
function copyModel(){
  function fallback(){var el=document.getElementById('imp-model');if(!el)return;var rg=document.createRange();rg.selectNodeContents(el);var sel=window.getSelection();sel.removeAllRanges();sel.addRange(rg);toast('Modelo selecionado: use Copiar do seu aparelho.');}
  try{navigator.clipboard.writeText(MODELO).then(function(){toast('Modelo copiado');},fallback);}catch(e){fallback();}
}
document.addEventListener('input',function(e){if(e.target&&e.target.id==='imp-text'&&ui.modal&&ui.modal.kind==='import'){ui.modal.text=e.target.value;ui.modal.fname=null;}});
document.addEventListener('change',function(e){
  var t=e.target,m=ui.modal;if(!t||!m||m.kind!=='import')return;
  if(t.id==='imp-file'&&t.files&&t.files[0])loadImportFile(t.files[0]);
  else if(t.id==='imp-spread'){m.spread=t.checked;renderModal();}
  else if(t.id==='imp-merge'){m.merge=t.checked;renderModal();}
});
['dragenter','dragover'].forEach(function(n){document.addEventListener(n,function(e){var z=e.target.closest&&e.target.closest('#imp-drop');if(z){e.preventDefault();z.classList.add('over');}});});
document.addEventListener('dragleave',function(e){var z=e.target.closest&&e.target.closest('#imp-drop');if(z)z.classList.remove('over');});
document.addEventListener('drop',function(e){var z=e.target.closest&&e.target.closest('#imp-drop');if(!z)return;e.preventDefault();var f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];loadImportFile(f);});

/* ---------- ações ---------- */
function curPart(){var m=ui.modal;if(!m)return null;var it=findItem(m.k,m.item);if(!it)return null;var p=it.parts.find(function(x){return x.id===m.id;});return p?{k:m.k,item:it,part:p}:null;}
function addLog(t,k,it,p,extra){var e={id:uid(),d:today(),t:t,k:k,item:it.id,part:p.id,iname:it.name,pname:p.name};if(extra)for(var x in extra)e[x]=extra[x];state.log.push(e);}

document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-act]');if(!el)return;
  var a=el.getAttribute('data-act');
  if(a==='overlay'){if(ev.target===el)closeModal();return;}
  var d=el.dataset;
  switch(a){
    case 'nav':ui.route=d.to;ui.modal=null;render();window.scrollTo(0,0);stashUi();break;
    case 'cal-prev':case 'cal-next':{var ym=ui.cal.split('-').map(Number),dt=new Date(ym[0],ym[1]-1+(a==='cal-next'?1:-1),1);ui.cal=dt.getFullYear()+'-'+pad(dt.getMonth()+1);render();break;}
    case 'cal-today':ui.cal=today().slice(0,7);ui.sel=today();render();break;
    case 'cal-day':ui.sel=d.d;if(d.d.slice(0,7)!==ui.cal)ui.cal=d.d.slice(0,7);render();break;
    case 'persona-edit':ui.editPersona=true;render();var ta=document.getElementById('persona-text');if(ta)ta.focus();break;
    case 'persona-cancel':ui.editPersona=false;render();if(dirty)scheduleSave();break;
    case 'persona-save':{var v=document.getElementById('persona-text').value;state.persona=v.trim();ui.editPersona=false;commit('Texto salvo');break;}
    case 'clear-ask':ui.clearAsk=true;render();break;
    case 'clear-no':ui.clearAsk=false;render();break;
    case 'clear-yes':{
      ['cap','proj'].forEach(function(k){state[k]=state[k].filter(function(i){return !i.ex;});});
      state.reviews=state.reviews.filter(function(r){return !r.ex&&findPart(r.part);});
      state.log=state.log.filter(function(e){return !e.ex;});
      if(state.example)state.persona='';
      state.example=false;ui.clearAsk=false;ui.sel=today();commit('Exemplos apagados. Agora é com você.');break;}
    case 'rev-again':case 'rev-ok':case 'rev-back':{
      var r=state.reviews.find(function(x){return x.id===d.id;});if(!r)break;var t=today(),f=findPart(r.part),msg;
      if(a==='rev-back'){r.stage=0;r.due=addDays(t,1);commit('Voltou para a revisão de amanhã');break;}
      if(f)addLog('review','cap',f.item,f.part,{a:a==='rev-again'?'again':'ok',st:r.stage});
      if(a==='rev-again'){r.due=addDays(t,1);msg='Revisar de novo amanhã ('+fmt(r.due)+')';}
      else if(r.stage===0){r.stage=1;r.due=addDays(t,7);msg='Próxima revisão em 1 semana: '+fmt(r.due);}
      else if(r.stage===1){r.stage=2;r.due=addMonths(t,1);msg='Próxima revisão em 1 mês: '+fmt(r.due);}
      else{r.stage=3;r.due=null;msg='Movida para a revisão futura';}
      commit(msg);break;}
    case 'rev-all':ui.revAll=!ui.revAll;render();break;
    case 'item-new':openModal({kind:'item',k:d.k});break;
    case 'item-edit':openModal({kind:'item',k:d.k,id:d.id});break;
    case 'item-del-ask':case 'part-del-ask':ui.modal.confirm=true;renderModal();break;
    case 'del-no':ui.modal.confirm=false;renderModal();break;
    case 'item-del-yes':{var m=ui.modal,it=findItem(m.k,m.id);if(it){var ids=it.parts.map(function(p){return p.id;});state[m.k]=state[m.k].filter(function(i){return i!==it;});state.reviews=state.reviews.filter(function(r){return ids.indexOf(r.part)<0;});}ui.modal=null;ui.route='list:'+m.k;commit('Excluído');break;}
    case 'part-new':openModal({kind:'partform',k:d.k,item:d.item});break;
    case 'part-bulk':openModal({kind:'bulk',k:d.k,item:d.item});break;
    case 'part-open':openModal({kind:'part',k:d.k,item:d.item,id:d.id});break;
    case 'part-work':{var c=curPart();if(!c)break;addLog('work',c.k,c.item,c.part);commit('Sessão registrada em '+fmt(today()));break;}
    case 'part-done':{var c2=curPart();if(!c2)break;var t2=today();c2.part.done=t2;addLog('done',c2.k,c2.item,c2.part);
      if(c2.k==='cap'){state.reviews=state.reviews.filter(function(r){return r.part!==c2.part.id;});state.reviews.push({id:uid(),part:c2.part.id,item:c2.item.id,stage:0,due:addDays(t2,1)});commit('Parte concluída. Revisão marcada para amanhã.');}
      else commit('Parte concluída');break;}
    case 'part-reopen':{var c3=curPart();if(!c3)break;var pid=c3.part.id,dd=c3.part.done;c3.part.done=null;var rm=false;state.log=state.log.filter(function(e){if(!rm&&e.t==='done'&&e.part===pid&&e.d===dd){rm=true;return false;}return true;});state.reviews=state.reviews.filter(function(r){return r.part!==pid;});commit('Parte reaberta');break;}
    case 'work-del':state.log=state.log.filter(function(e){return e.id!==d.id;});commit('Sessão apagada');break;
    case 'part-edit':ui.modal.edit=true;ui.modal.confirm=false;renderModal();break;
    case 'part-edit-cancel':if(ui.modal.kind==='part'){ui.modal.edit=false;ui.modal.confirm=false;renderModal();}else closeModal();break;
    case 'part-del-yes':{var mm=ui.modal,it2=findItem(mm.k,mm.item);if(it2){it2.parts=it2.parts.filter(function(p){return p.id!==mm.id;});state.reviews=state.reviews.filter(function(r){return r.part!==mm.id;});}ui.modal=null;commit('Parte excluída');break;}
    case 'modal-close':closeModal();break;
    case 'imp-open':openModal({kind:'import',k:d.k,into:d.into||null,text:'',step:'input',spread:true,merge:true});break;
    case 'imp-preview':{var mi=ui.modal,ta2=document.getElementById('imp-text');if(ta2&&ta2.value!==mi.text){mi.text=ta2.value;mi.fname=null;}if(!String(mi.text||'').trim()){mi.err='Escolha um arquivo ou cole o texto primeiro.';renderModal();break;}mi.err=null;mi.step='preview';renderModal();break;}
    case 'imp-back':ui.modal.step='input';renderModal();break;
    case 'imp-use':ui.modal.text=MODELO;ui.modal.fname=null;ui.modal.err=null;renderModal();break;
    case 'imp-copy':copyModel();break;
    case 'imp-dl':if(dl)dl.save({filename:'modelo-pessoa-necessaria.txt',data:MODELO}).catch(function(e){var c=e&&e.code;if(c!=='declined')toast('Não deu para baixar aqui. Use “Copiar modelo”.');});break;
    case 'imp-do':doImport();break;
    case 'pr-plan':copyText(promptPlan(d.id?findItem(d.k,d.id):null),'Prompt de divisão em partes');break;
    case 'pr-study':{var cs=curPart();if(cs)copyText(promptStudy(cs.item,cs.part),'Prompt da sessão de estudo');break;}
    case 'pr-review-part':{var cr=curPart();if(cr)copyText(promptReview(cr.item,cr.part,reviewOf(cr.part.id)),'Prompt de revisão');break;}
    case 'pr-review':{var rv=state.reviews.find(function(x){return x.id===d.id;}),fr=rv&&findPart(rv.part);if(fr)copyText(promptReview(fr.item,fr.part,rv),'Prompt de revisão');break;}
    case 'prompt-copy':{var pt=ui.modal&&ui.modal.text;if(pt){try{navigator.clipboard.writeText(pt).then(function(){toast('Copiado');},function(){selectPrompt();toast('Use Copiar do seu aparelho: o texto está selecionado.');});}catch(e){selectPrompt();}}break;}
    case 'prompt-back':{var bk=ui.modal.back;ui.modal=bk;renderModal();break;}
    case 'card-edit':ui.modal.cardEdit=true;renderModal();var ct=document.getElementById('card-text');if(ct)ct.focus();break;
    case 'card-cancel':ui.modal.cardEdit=false;renderModal();if(dirty)scheduleSave();break;
    case 'card-save':{var cp=curPart(),cv=document.getElementById('card-text');if(!cp||!cv)break;cp.part.card=cv.value.trim();ui.modal.cardEdit=false;commit(cp.part.card?'Cartão salvo':'Cartão removido');break;}
  }
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&ui.modal){if(ui.modal.edit){ui.modal.edit=false;renderModal();}else closeModal();}});
document.addEventListener('submit',function(ev){
  var f=ev.target,kind=f.getAttribute('data-form');if(!kind)return;ev.preventDefault();
  var fd=new FormData(f),m=ui.modal;if(!m)return;
  if(kind==='item'){
    var name=String(fd.get('name')||'').trim(),due=String(fd.get('due')||'')||null,books=String(fd.get('books')||'').trim();if(!name)return;
    if(m.id){var it=findItem(m.k,m.id);if(it){it.name=name;it.due=due;it.books=books;}ui.modal=null;commit('Alterações salvas');}
    else{var nw={id:uid(),name:name,due:due,books:books,parts:[]};state[m.k].push(nw);ui.modal=null;ui.route='item:'+m.k+':'+nw.id;commit((m.k==='cap'?'Capacidade criada':'Projeto criado')+'. Agora divida em partes.');}
  }else if(kind==='part'){
    var it2=findItem(m.k,m.item);if(!it2)return;var pn=String(fd.get('name')||'').trim(),pd=String(fd.get('due')||'')||null,pnote=String(fd.get('note')||'').trim();if(!pn)return;
    if(m.id){var p=it2.parts.find(function(x){return x.id===m.id;});if(p){p.name=pn;p.due=pd;p.note=pnote;}ui.modal={kind:'part',k:m.k,item:m.item,id:m.id};commit('Parte atualizada');}
    else{it2.parts.push({id:uid(),name:pn,due:pd,done:null,note:pnote});ui.modal=null;commit('Parte adicionada');}
  }else if(kind==='bulk'){
    var it3=findItem(m.k,m.item);if(!it3)return;
    var lines=String(fd.get('lines')||'').split('\n').map(function(s){return s.replace(/^\s*(?:[-•*]|\d+[.)])\s+/,'').trim();}).filter(Boolean);if(!lines.length)return;
    var md=fd.get('mode')||'none',same=String(fd.get('date')||'')||null,t=today(),span=it3.due?Math.max(diff(t,it3.due),0):0;
    lines.forEach(function(nm,i){var due=null;if(md==='spread'&&it3.due)due=addDays(t,Math.max(1,Math.round((i+1)*span/lines.length)));else if(md==='same')due=same;it3.parts.push({id:uid(),name:nm.slice(0,160),due:due,done:null});});
    ui.modal=null;commit(lines.length+' '+plural(lines.length,'parte adicionada','partes adicionadas'));
  }
});

render();
initCaps();
})();
</script>
